[project]
name = "spi"
version = "0.1.0"
description = "Student Performance Indicator using Machine Learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
